<!DOCTYPE html>
<!-- =========================================================
     TonttuStudio — v6 (korjattu versio)
     • Täydet pikkukuvat
     • Ei rakoa otsikon alla
     • Toolbar ei peitä esikatselua
     • Ei muita muutoksia ulkoasuun
     • Tonttua ei koskettu
     --------------------------------------------------------- -->
<html lang="fi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<!-- Fontit -->
<link href="https://fonts.googleapis.com/css2?family=Emilys+Candy&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<title>TonttuStudio – Lisää tunnelmaa jouluun ✨</title>

<style>
html, body { margin: 0; padding: 0; height: 100%; }
:root{ --red:#8d1b1b; --gold:#f6d778; --gold-edge:#7f642a; }

body{
  background:var(--red);
  color:#fff;
  font-family: 'Fredoka', sans-serif;
}

/* ============================= */
/*            LAYOUT             */
/* ============================= */

.wrap{
  max-width:720px;
  margin:0 auto;
  padding:16px;
  position:relative;
}

/* Otsikko korjattu — ei rakoa */
h1{
  position:sticky;
  top:0;
  z-index:300;

  margin:0;
  padding:6px 0 8px 0;

  display:flex;
  align-items:flex-end;
  justify-content:center;
  gap:8px;

  background:var(--red);

  font-size:42px;
  color:#ffd700;
  text-shadow:0 2px 0 rgba(0,0,0,.25), 0 0 16px rgba(243,209,119,.35);
  font-weight:700;
  font-family:'Emilys Candy', cursive;
}

.title-tonttu{
  height:60px;
  align-self:flex-end;
  margin-bottom:-2px;
}

/* Toolbar — korjattu top */
.toolbar{
  position:sticky;
  top:68px;
  z-index:250;

  display:flex;
  gap:10px;
  justify-content:center;
  align-items:center;
  padding:4px 2px;
  background:var(--red);
}

button, label.button{
  white-space:nowrap;
  background:linear-gradient(#ffe7a5,#e5c66d);
  color:#2b1c00;
  border:2px solid var(--gold-edge);
  padding:10px 18px;
  border-radius:24px;
  font-size:16px;
  font-weight:500;
  box-shadow:0 4px 0 #6e5624, 0 8px 16px rgba(0,0,0,.25);
  cursor:pointer;
  font-family:'Fredoka', sans-serif;
}

input[type=file]{display:none}

/* Esikatselu — korjattu top */
.preview{
  width: calc(100% + 32px);
  margin:0 -16px 18px;

  aspect-ratio:1/1;
  border-radius:16px;
  border:3px solid var(--gold);
  background:#121212;
  overflow:hidden;

  position:sticky;
  top:140px;
  z-index:50;

  box-shadow:0 18px 40px rgba(0,0,0,0.7);
}

.preview-hint{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  color:#f6d778;
  font-size:18px;
  text-align:center;
  opacity:0.9;
  pointer-events:none;
}

canvas{
  width:100%;
  height:100%;
  background:#121212;
  display:block;
  touch-action:none;
}

/* ============================= */
/*        THUMBNAIL-KIRJASTO     */
/* ============================= */

.thumbs{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin-top:10px; /* Lisätty vain tämä rako */
}

.thumb-title{
  grid-column:1/-1;
  font-size:17px;
  color:#f6d778;
  margin:10px 0 4px;
  padding-left:4px;
}

.thumb{
  background:rgba(0,0,0,.55);
  border-radius:14px;
  padding:6px;
  box-shadow:0 0 0 2px rgba(243,209,119,.30) inset, 0 6px 16px rgba(0,0,0,.35);
  display:flex;
  align-items:center;
  justify-content:center;
  aspect-ratio:1/1;
}

.thumb img{
  max-width:100%;
  max-height:100%;
  display:block;
  -webkit-user-drag:none;
  user-select:none;
  cursor:pointer;
}

/* Poistoruksi */
.remove-btn{
  position:absolute;
  font-size:26px;
  font-weight:900;
  color:#fff;
  display:none;
  text-shadow:0 1px 3px rgba(0,0,0,.7);
  pointer-events:auto;
  z-index:10;
}

.note{
  color:#ffe7a5;
  font-size:13px;
  margin:8px 0 12px;
}

</style>

<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
</head>

<body>

<h1>

  TonttuStudio

<!-- Toolbar -->
<div class="toolbar">

<!-- Preview -->
<div class="preview" id="preview">

</div>

<div class="note">✨ Lisää koristeita, siirrä ja muokkaa kahdella sormella.</div>

<!-- THUMBNAILS — täysi kirjasto palautettu sellaisenaan -->
<div id="thumbs" class="thumbs">

<!-- ============================= -->
<!--      JAVASCRIPT — TARRAT      -->
<!-- ============================= -->

<script>
let bgBitmap=null;
let stickers=[];
let activeIndex=-1;

const file=document.getElementById('file');
const save=document.getElementById('save');
const clearBtn=document.getElementById('clear');
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d',{alpha:false});
const preview=document.getElementById('preview');
const hint=document.querySelector('.preview-hint');

canvas.width=1200;
canvas.height=1200;

/* Poistonappi */
const del=document.createElement('div');
del.className='remove-btn';
del.textContent='×';
preview.appendChild(del);

/* ============================= */
/*        PIIRTO & NÄYTÖT        */
/* ============================= */

function draw(){
  ctx.fillStyle='#121212';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  if(bgBitmap){
    ctx.save();
    ctx.translate(bg.x,bg.y);
    ctx.scale(bg.s,bg.s);
    ctx.drawImage(bgBitmap,0,0);
    ctx.restore();
  }

  for(const s of stickers){
    ctx.save();
    ctx.translate(s.x,s.y);
    ctx.rotate(s.r);
    ctx.scale(s.s,s.s);
    ctx.drawImage(s.img,-s.w/2,-s.h/2);
    ctx.restore();
  }

  if(activeIndex>=0){
    const s=stickers[activeIndex];
    ctx.save();
    ctx.translate(s.x,s.y);
    ctx.rotate(s.r);
    ctx.scale(s.s,s.s);
    ctx.lineWidth=4/s.s;
    ctx.strokeStyle='#f6d778';
    ctx.strokeRect(-s.w/2,-s.h/2,s.w,s.h);
    ctx.restore();
  }
}

function canvasPos(e){
  const r=canvas.getBoundingClientRect();
  return{
    x:(e.clientX - r.left)*(canvas.width/r.width),
    y:(e.clientY - r.top)*(canvas.height/r.height)
  };
}

/* ============================= */
/*     POINTERIT — DRAG/ZOOM     */
/* ============================= */

let pointers=new Map();
let bg={x:0,y:0,s:1};

canvas.addEventListener('pointerdown',e=>{
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

  const p=canvasPos(e);
  activeIndex=-1;

  for(let i=stickers.length-1;i>=0;i--){
    const s=stickers[i];
    if(Math.abs(p.x-s.x)<200 && Math.abs(p.y-s.y)<200){
      activeIndex=i;
      break;
    }
  }
  updateDelete();
});

canvas.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return;

  const cur=pointers.get(e.pointerId);
  const dx=e.clientX-cur.x;
  const dy=e.clientY-cur.y;
  cur.x=e.clientX; cur.y=e.clientY;

  const scale=canvas.width/canvas.getBoundingClientRect().width;

  if(activeIndex>=0){
    const s=stickers[activeIndex];
    s.x+=dx*scale;
    s.y+=dy*scale;
    draw(); updateDelete();
    return;
  }

  if(bgBitmap){
    bg.x+=dx*scale;
    bg.y+=dy*scale;
    draw();
  }
});

canvas.addEventListener('pointerup',e=>{
  pointers.delete(e.pointerId);
});

/* ============================= */
/*        KUVAN AVAAMINEN        */
/* ============================= */

file.addEventListener('change',async e=>{
  const f=e.target.files[0];
  if(!f)return;

  let img=new Image();

  if(/heic|heif/i.test(f.type)){
    const conv=await heic2any({blob:f,toType:"image/png"});
    img.src=URL.createObjectURL(conv);
  }else{
    img.src=URL.createObjectURL(f);
  }

  await img.decode();

  bgBitmap=img;

  bg.s = 1200/Math.max(img.width,img.height);
  bg.x = (1200 - img.width*bg.s)/2;
  bg.y = (1200 - img.height*bg.s)/2;

  hint.style.display='none';

  draw();
});

/* ============================= */
/*        STICKER LISÄYS        */
/* ============================= */

document.getElementById('thumbs').addEventListener('click',async e=>{
  if(e.target.tagName!=='IMG')return;

  const img=new Image();
  img.crossOrigin='anonymous';
  img.src=e.target.src;
  await img.decode();

  stickers.push({
    img,
    w:img.width,
    h:img.height,
    x:600,
    y:600,
    s:0.4,
    r:0
  });

  activeIndex=stickers.length-1;

  draw();
  updateDelete();
});

/* ============================= */
/*        POISTONAPPI           */
/* ============================= */

function updateDelete(){
  if(activeIndex<0){ del.style.display='none'; return; }

  del.style.display='block';

  const s=stickers[activeIndex];
  const r=canvas.getBoundingClientRect();
  const px=(s.x + s.w*s.s/2)*(r.width/1200)+r.left;
  const py=(s.y - s.h*s.s/2)*(r.height/1200)+r.top;

  const pr=preview.getBoundingClientRect();
  del.style.left=(px - pr.left)+'px';
  del.style.top=(py - pr.top)+'px';
}

del.addEventListener('click',()=>{
  if(activeIndex>=0){
    stickers.splice(activeIndex,1);
    activeIndex=-1;
    draw();
    updateDelete();
  }
});

/* ============================= */
/*             SAVE              */
/* ============================= */

save.addEventListener('click',()=>{
  const a=document.createElement('a');
  a.href=canvas.toDataURL('image/png');
  a.download='TonttuStudio.png';
  a.click();
});

/* ============================= */
/*             CLEAR             */
/* ============================= */

clearBtn.addEventListener('click',()=>{
  stickers=[];
  activeIndex=-1;
  bgBitmap=null;
  hint.style.display='block';
  draw();
});

draw();
</script>

</body>
