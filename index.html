<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>TonttuStudio</title>

<link href="https://fonts.googleapis.com/css2?family=Emilys+Candy&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

<style>
:root{
  --red:#8d1b1b;
  --gold:#f6d778;
  --gold-edge:#7f642a;
}

html,body{
  margin:0;
  padding:0;
  height:100%;
  background:var(--red);
  font-family:'Fredoka',sans-serif;
  color:#fff;
  -webkit-font-smoothing:antialiased;
}

.wrap{
  max-width:720px;
  margin:0 auto;
  padding:16px;
}

/* -------------------- Otsikko -------------------- */
h1{
  position:sticky;
  top:0;
  margin:0;
  margin-bottom:6px;
  padding:6px 0 4px 0;
  background:var(--red);
  z-index:400;

  display:flex;
  justify-content:center;
  align-items:flex-end;
  gap:8px;

  font-family:'Emilys Candy';
  font-size:46px;
  color:#ffd85a;
  letter-spacing:0.5px;
  text-shadow:0 2px 0 #0005, 0 0 14px rgba(243,209,119,.35);
}

.title-tonttu{
  height:70px;
  margin-bottom:-2px;
}

/* -------------------- Toolbar -------------------- */
.toolbar{
  position:sticky;
  top:68px;
  z-index:390;

  display:flex;
  gap:10px;
  justify-content:center;
  align-items:center;

  padding:6px 4px;
  background:var(--red);
}

button,label.button{
  background:linear-gradient(#ffe7a5,#e5c66d);
  color:#2b1c00;
  padding:10px 18px;
  border-radius:26px;
  border:2px solid var(--gold-edge);
  font-size:16px;
  font-weight:600;
  box-shadow:0 4px 0 #6e5624,0 8px 16px #0004;
  white-space:nowrap;
  cursor:pointer;
  font-family:'Fredoka',sans-serif;
}

input[type=file]{display:none}

/* -------------------- Esikatselu -------------------- */
.preview{
  position:sticky;
  top:132px;
  z-index:200;

  margin:0 -16px 12px;
  width:calc(100% + 32px);
  aspect-ratio:1/1;
  border-radius:20px;
  border:3px solid var(--gold);
  background:#111;
  overflow:hidden;

  box-shadow:0 10px 40px #0007;
  transform:scale(0.97);
  transition:0.25s;
}

.preview-hint{
  position:absolute;
  left:50%; top:50%;
  transform:translate(-50%,-50%);
  color:#f6d778;
  font-size:19px;
  opacity:0.9;
  text-align:center;
  pointer-events:none;
}

canvas{
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

/* -------------------- Thumbnails -------------------- */

.thumb-title{
  grid-column:1/-1;
  color:#ffd;
  opacity:0.9;
  font-size:18px;
  margin:10px 0 4px;
  padding-left:6px;
}

.thumbs{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin-top:6px;
}

.thumb{
  background:#0004;
  border-radius:14px;
  box-shadow:0 0 0 2px rgba(243,209,119,.35) inset, 0 4px 10px #0005;
  padding:6px;
  aspect-ratio:1/1;
  display:flex;
  align-items:center;
  justify-content:center;
}

.thumb img{
  max-width:100%;
  max-height:100%;
  display:block;
  -webkit-user-drag:none;
  user-select:none;
  cursor:pointer;
}

/* -------------------- Delete button -------------------- */
.remove-btn{
  position:absolute;
  font-size:26px;
  font-weight:900;
  color:#fff;
  pointer-events:auto;
  text-shadow:0 1px 4px #000c;
  display:none;
  z-index:20;
}

/* -------------------- Footer -------------------- */
footer{
  text-align:center;
  color:#ffd;
  opacity:0.95;
  margin-top:40px;
  padding-bottom:40px;
  font-size:18px;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
</head>

<body>
<div class="wrap">

<h1>
  <img src="https://raw.githubusercontent.com/tonttustudio/tonttustudio/main/Otsikontonttu1.png"
       class="title-tonttu" alt="Tonttu">
  TonttuStudio
</h1>

<!-- Toolbar -->
<div class="toolbar">
  <label class="button" for="file">Avaa kuva</label>
  <input id="file" type="file" accept="image/*,image/heic,image/heif,image/webp" />
  <button id="save">Tallenna</button>
  <button id="clear">Tyhjennä</button>
</div>

<!-- Preview -->
<div class="preview" id="preview">
  <canvas id="c" width="1200" height="1200"></canvas>
  <div class="preview-hint">✨ Avaa kuva ja sovita se ruutuun ✨</div>
</div>

<!-- THUMBNAILS -->
<div id="thumbs" class="thumbs">

<div class="thumb-title">Tekstit</div>
<div class="thumb"><img src="koristeet/jouluteksti.png"></div>
<div class="thumb"><img src="koristeet/pikkujoulu.png"></div>
<div class="thumb"><img src="koristeet/Teksti.png"></div>
<div class="thumb"><img src="koristeet/tekstinauha-(1)-(1).png"></div>
<div class="thumb"><img src="koristeet/621005e7-5c3c-4c82-b4cd-7a51d7eb2346.png"></div>

<div class="thumb-title">Kehykset</div>
<div class="thumb"><img src="koristeet/candykehys.png"></div>
<div class="thumb"><img src="koristeet/kehys-(3).png"></div>
<div class="thumb"><img src="koristeet/kehys-(1).png"></div>
<div class="thumb"><img src="koristeet/havukehys-(1).png"></div>
<div class="thumb"><img src="koristeet/lahjat-(2).png"></div>

</div>

<footer>🎄 Tonttuilun iloa ja joulumieltä! ✨</footer>

</div>

<script>
let bg=null;
let bgImg=null;
let stickers=[];
let active=-1;

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d",{alpha:false});
const preview=document.getElementById("preview");
const hint=document.querySelector(".preview-hint");
const del=document.createElement("div");
del.className="remove-btn";
del.textContent="×";
preview.appendChild(del);

function draw(){
  ctx.fillStyle="#111";
  ctx.fillRect(0,0,1200,1200);

  if(bgImg){
    ctx.save();
    ctx.translate(bg.x,bg.y);
    ctx.scale(bg.s,bg.s);
    ctx.drawImage(bgImg,0,0);
    ctx.restore();
  }

  for(let i=0;i<stickers.length;i++){
    const s=stickers[i];
    ctx.save();
    ctx.translate(s.x,s.y);
    ctx.rotate(s.r);
    ctx.scale(s.s,s.s);
    ctx.drawImage(s.img,-s.w/2,-s.h/2);
    ctx.restore();
  }

  if(active>=0){
    const s=stickers[active];
    ctx.save();
    ctx.translate(s.x,s.y);
    ctx.rotate(s.r);
    ctx.scale(s.s,s.s);
    ctx.lineWidth=6/s.s;
    ctx.strokeStyle="#f6d778";
    ctx.strokeRect(-s.w/2,-s.h/2,s.w,s.h);
    ctx.restore();
  }
}

function pos(e){
  const r=canvas.getBoundingClientRect();
  return {
    x:(e.clientX-r.left)*(1200/r.width),
    y:(e.clientY-r.top)*(1200/r.height)
  };
}

let pointers=new Map();

/* Pointer down */
canvas.addEventListener("pointerdown",e=>{
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const p=pos(e);

  active=-1;
  for(let i=stickers.length-1;i>=0;i--){
    const s=stickers[i];
    if(Math.abs(p.x-s.x)<200 && Math.abs(p.y-s.y)<200){ active=i; break; }
  }

  updateDelete();
});

/* Pointer move */
canvas.addEventListener("pointermove",e=>{
  if(!pointers.has(e.pointerId)) return;

  const cur=pointers.get(e.pointerId);
  const dx=e.clientX-cur.x;
  const dy=e.clientY-cur.y;
  cur.x=e.clientX; cur.y=e.clientY;

  const scale=1200/canvas.getBoundingClientRect().width;

  if(active>=0){
    const s=stickers[active];
    s.x+=dx*scale;
    s.y+=dy*scale;
    draw();
    updateDelete();
    return;
  }

  if(bg){
    bg.x+=dx*scale;
    bg.y+=dy*scale;
    draw();
  }
});

/* Pointer up */
canvas.addEventListener("pointerup",e=>{
  pointers.delete(e.pointerId);
});

/* Add sticker */
document.getElementById("thumbs").addEventListener("click",async e=>{
  if(e.target.tagName!=="IMG")return;

  const img=new Image();
  img.src=e.target.src;
  await img.decode();

  stickers.push({
    img,
    w:img.width,
    h:img.height,
    x:600, y:600,
    s:0.4,
    r:0
  });

  active=stickers.length-1;
  draw();
  updateDelete();
});

/* Update delete button position */
function updateDelete(){
  if(active<0){ del.style.display="none"; return; }

  del.style.display="block";
  const s=stickers[active];

  const r=canvas.getBoundingClientRect();
  const px=(s.x+ s.w*s.s/2)*(r.width/1200)+r.left;
  const py=(s.y- s.h*s.s/2)*(r.height/1200)+r.top;

  const pr=preview.getBoundingClientRect();
  del.style.left=(px-pr.left)+"px";
  del.style.top=(py-pr.top)+"px";
}

/* Delete sticker */
del.addEventListener("click",()=>{
  if(active>=0){
    stickers.splice(active,1);
    active=-1;
    draw();
    updateDelete();
  }
});

/* Load image */
document.getElementById("file").addEventListener("change",async e=>{
  const f=e.target.files[0];
  if(!f)return;

  const blob=f;
  let img=null;

  if(/heic|heif/i.test(f.type)){
    const converted=await heic2any({blob:f,toType:"image/png"});
    img=new Image();
    img.src=URL.createObjectURL(converted);
  }else{
    img=new Image();
    img.src=URL.createObjectURL(blob);
  }

  await img.decode();
  bgImg=img;
  bg={
    x:(1200-img.width)/2,
    y:(1200-img.height)/2,
    s:1200/Math.max(img.width,img.height)
  };

  hint.style.display="none";
  draw();
});

/* Save */
document.getElementById("save").addEventListener("click",()=>{
  const a=document.createElement("a");
  a.href=canvas.toDataURL("image/png",1);
  a.download="TonttuStudio.png";
  a.click();
});

/* Clear */
document.getElementById("clear").addEventListener("click",()=>{
  stickers=[];
  active=-1;
  bgImg=null;
  hint.style.display="block";
  draw();
});
</script>

</body>
</html>
