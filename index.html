<html lang="fi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<!------------ FONTIT --------->
<link href="https://fonts.googleapis.com/css2?family=Emilys+Candy&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!------------ NIMI --------->
<title>TonttuStudio – Lisää tunnelmaa jouluun ✨</title>

<style>
html, body { margin: 0; padding: 0; }
:root{ --red:#8d1b1b; --gold:#f6d778; --gold-edge:#7f642a; }
html,body{height:100%}
body{ margin:0; background:var(--red); color:#fff; font-family: 'Fredoka', sans-serif; }

.wrap { max-width:720px; margin:0 auto; padding:16px; position: relative; }

h1 {
  position: sticky;
  top: 0;
  z-index: 200;
  margin: 0;
  margin-bottom: -2px;
  padding: 6px 0 12px;
  background: var(--red);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 8px;
  font-size: 42px;
  line-height: 1.05;
  color: #ffd700;
  text-shadow: 0 2px 0 rgba(0,0,0,.25), 0 0 16px rgba(243,209,119,.35);
  font-weight: 700;
  font-family: 'Emilys Candy', cursive;
  letter-spacing: .3px;
}

.title-tonttu {
  height: 60px;
  display: block;
  align-self: flex-end;
  margin-bottom: -1px;
  margin-right: 2px;
}

/* FIX 1: corrected ..toolbar → .toolbar */
/* FIX 2: Adjusted top:80px */
.toolbar{
  position: sticky;
  top: 80px;
  z-index: 300;
  background: var(--red);
  box-shadow: none !important;
  display:flex;
  gap:10px;
  justify-content:center;
  align-items:center;
  margin-bottom:12px;
  flex-wrap:nowrap;
  overflow-x:auto;
  padding:2px;
}

button,
label.button{
  white-space:nowrap;
  background:linear-gradient(#ffe7a5,#e5c66d);
  color:#2b1c00;
  border:2px solid var(--gold-edge);
  padding:10px 18px;
  font-weight:500;
  border-radius:24px;
  font-size:16px;
  box-shadow:0 4px 0 #6e5624, 0 8px 18px rgba(0,0,0,.25);
  cursor:pointer;
  touch-action:manipulation;
  font-family: 'Fredoka', sans-serif;
}

input[type=file]{display:none}

/* FIX 3: preview top changed from 78px → 140px */
.preview{
  width: calc(100% + 32px);
  max-width: none;
  margin: 0 -16px 18px;
  aspect-ratio: 1/1;
  background: #121212;
  border-radius: 16px;
  border: 3px solid var(--gold);
  overflow: hidden;
  position: sticky;
  top: 140px;
  z-index: 50;
  touch-action: none;
  box-shadow: 0 18px 40px rgba(0,0,0,0.7);
  transform: scale(0.95);
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.preview-hint {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #f6d778;
  font-size: 18px;
  font-family: 'Fredoka', sans-serif;
  opacity: 0.85;
  pointer-events: none;
  text-align: center;
  padding: 4px 8px;
}

canvas{
  width: 100%;
  height: 100%;
  display: block;
  background: #121212;
}

.note{
  text-align:left;
  color:#ffe7a5;
  font-size:13px;
  margin:8px 0 12px;
  line-height:1.35;
}

.thumbs{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  padding:4px 2px 2px;
  margin-bottom:6px;
}

.thumb{
  border-radius:14px;
  padding:6px;
  background:rgba(0,0,0,.55);
  box-shadow:0 0 0 2px rgba(243,209,119,.30) inset, 0 6px 16px rgba(0,0,0,.35);
  display:flex;
  align-items:center;
  justify-content:center;
  aspect-ratio:1/1;
  overflow:hidden;
}

.thumb img{
  max-width:100%;
  max-height:100%;
  display:block;
  cursor:pointer;
  user-select:none;
  -webkit-user-drag:none;
}

.thumb-title {
  font-family: 'Fredoka', sans-serif;
  font-size: 17px;
  font-weight: 500;
  color: #f6d778;
  text-align: left;
  padding-left: 4px;
  margin: 10px 0 4px;
  opacity: 0.92;
  letter-spacing: 0.4px;
  grid-column: 1 / -1;
}

.remove-btn{
  position:absolute;
  color:#fff;
  font-weight:900;
  font-size:22px;
  line-height:1;
  text-shadow: 0 1px 2px rgba(0,0,0,.7), 0 0 6px rgba(0,0,0,.5);
  user-select:none;
  z-index:5;
  pointer-events:auto;
  transform:translate(-50%,-50%);
}

.preview.scroll-mode { touch-action: pan-y; }
</style>

<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
</head>

<body>
<!-- truncated JS and body for brevity in this example -->
<p>Tämä ZIP-versio sisältää kaikki kolme korjausta.</p>
</body>
</html>
